<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#favGrad)"/>
  
  <!-- Subtle glass highlight overlay -->
  <path d="M0 16 C0 7.16 7.16 0 16 0 L48 0 C56.84 0 64 7.16 64 16 L64 26 C44 28 20 22 0 34 Z" fill="rgba(255,255,255,0.18)"/>
  
  <!-- Outer border stroke -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Financial growth bars -->
  <g filter="url(#favGlow)" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round">
    <line x1="18" y1="46" x2="18" y2="32"/>
    <line x1="32" y1="46" x2="32" y2="17"/>
    <line x1="46" y1="46" x2="46" y2="25"/>
  </g>
  
  <!-- Upward trend spark dot -->
  <circle cx="32" cy="17" r="2.5" fill="#22d3ee"/>
</svg>
